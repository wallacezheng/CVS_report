name: probe

# 新來源試探：對指定網址各送一次請求，把回應存到 data/probe/ 供研究頁面結構。只抓填入的網址。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "要試探的網址（空白分隔，最多 10 個）"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          PROBE_URLS: ${{ inputs.urls }}
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: python tools/probe.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: $(date -u +%F)"
          git pull --rebase --autostash
          git push
