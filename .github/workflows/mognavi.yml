name: mognavi

# もぐナビ週排行與口碑（內部研究）。結果只寫入 Google Sheet，不寫入公開 repo、不寄信。
# 2026-10-29 起もぐナビ對本程式回應 403（第一次執行後被封鎖），已停用自動排程；不做繞過。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe＝只試探 1 個請求；update＝更新資料（自動備份、抓不到不覆蓋）；cleanup＝不連網整理排行；export＝不連網，只重新產生儀表板加密檔"
        type: choice
        options: [probe, update, cleanup, export, restore]
        default: probe
      translate:
        description: "用 Gemini 比對官網商品並產生中文口碑摘要"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mognavi
  cancel-in-progress: false

jobs:
  mognavi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run mognavi job
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_GEMINI_USD_PER_MONTH: ${{ vars.MAX_GEMINI_USD_PER_MONTH }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          CRAWLER_UA: ${{ vars.CRAWLER_UA }}
          MOGNAVI_TOP_N: ${{ vars.MOGNAVI_TOP_N }}
          MOGNAVI_MAX_PRODUCTS: ${{ vars.MOGNAVI_MAX_PRODUCTS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          MOGNAVI_MODE: ${{ inputs.mode || 'update' }}
          # 手動執行時不看 sources 分頁的開關（已停用也可手動試一次）；排程已移除
          MOGNAVI_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          ENRICH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && (inputs.translate && '1' || '0') || '1' }}
        run: python -m scraper.mognavi_job

      - name: Commit encrypted dashboard data
        run: |
          git config user.name "cvs-intel-bot"
          git config user.email "cvs-intel-bot@users.noreply.github.com"
          git add docs/data/mognavi.enc.json data/gemini_usage.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "加密檔沒有變更"
          else
            git commit -m "data: もぐナビ加密檔 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase --autostash
            git push
          fi
